name: Source and tooling checks
on:
  push:
    branches: [main, oneplus-8, oneplus-8-pro, oneplus-8t, oneplus-9r, oneplus-9, oneplus-9-pro]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check Python and device invariants
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -v
      - name: Check all model patches and run C gesture regressions
        run: python3 scripts/audit.py
